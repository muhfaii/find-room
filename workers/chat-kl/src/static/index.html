<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cari Bilik Sewa KL — Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --surface-0: #efefec;
        --surface-1: #e8e8e4;
        --surface-2: #dddcd8;
        --surface-3: #d4d4d0;
        --surface-4: #c8c8c4;
        --border: #d4d4d0;
        --border-subtle: #dddcd8;
        --text-primary: #1b1b1b;
        --text-secondary: #555555;
        --text-muted: #999999;
        --accent: #1e88e5;
        --accent-hover: #1769aa;
        --accent-tint: rgba(30, 136, 229, 0.1);
        --success: #4ade80;
        --danger: #e85454;
        --warning: #facc15;

        --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --fs-xl: 1.25rem;
        --fs-lg: 1.125rem;
        --fs-base: 1rem;
        --fs-sm: 0.875rem;
        --fs-xs: 0.75rem;

        --icon-sm: 14px;
        --icon-md: 16px;
        --icon-lg: 20px;
        --icon-xl: 28px;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        font-family: var(--font-sans);
        font-size: var(--fs-base);
        line-height: 1.5;
        background: var(--surface-0);
        color: var(--text-primary);
      }
      .icon {
        width: var(--icon-md);
        height: var(--icon-md);
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
        vertical-align: -3px;
      }
      .icon-sm { width: var(--icon-sm); height: var(--icon-sm); }
      .icon-lg { width: var(--icon-lg); height: var(--icon-lg); }
      .icon-xl { width: var(--icon-xl); height: var(--icon-xl); }
      .icon-star { fill: currentColor; stroke: none; }
      .app {
        max-width: 720px;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-subtle);
        background: var(--surface-1);
      }
      header h1 {
        margin: 0;
        font-size: var(--fs-xl);
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      header p {
        margin: 2px 0 0;
        font-size: var(--fs-sm);
        color: var(--text-secondary);
      }

      /* ---- Onboarding wizard ---- */
      #onboarding {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        padding: 24px 20px;
      }
      .progress-dots {
        display: flex;
        gap: 6px;
        margin-bottom: 20px;
      }
      .progress-dots .progress-dot {
        height: 6px;
        flex: 1;
        padding: 0;
        border: none;
        border-radius: 999px;
        background: var(--surface-3);
        cursor: pointer;
      }
      .progress-dots .progress-dot.done { background: var(--accent); }
      .progress-dots .progress-dot.current { background: var(--accent); opacity: 0.5; }

      .skip-wizard { margin-top: 20px; text-align: center; }
      .skip-wizard button {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-family: inherit;
        font-size: var(--fs-sm);
        font-weight: 500;
        text-decoration: underline;
        cursor: pointer;
        padding: 8px 4px;
      }

      .step-eyebrow {
        font-size: var(--fs-xs);
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin: 0 0 4px;
      }
      .step-title {
        font-size: var(--fs-xl);
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
      }
      .step-subtitle {
        font-size: var(--fs-sm);
        color: var(--text-secondary);
        margin: 0 0 18px;
      }

      .option-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .option-grid.single-col { grid-template-columns: 1fr; }
      .option-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px;
        min-height: 44px;
        border: 1.5px solid var(--border);
        border-radius: 14px;
        background: var(--surface-1);
        color: var(--text-primary);
        font-family: inherit;
        font-size: var(--fs-sm);
        font-weight: 500;
        text-align: left;
        cursor: pointer;
      }
      .option-card .icon { color: var(--text-muted); }
      .option-card .option-label { flex: 1; }
      .option-card .option-hint {
        display: block;
        font-size: var(--fs-xs);
        font-weight: 400;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .option-card.selected {
        border-color: var(--accent);
        background: var(--accent-tint);
      }
      .option-card.selected .icon { color: var(--accent); }

      .step-input {
        width: 100%;
        padding: 13px 14px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        font-family: inherit;
        font-size: var(--fs-base);
        margin-top: 12px;
        outline: none;
      }
      .step-input:focus { border-color: var(--accent); }

      .step-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 24px;
      }
      .step-actions .text-link {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-family: inherit;
        font-size: var(--fs-sm);
        font-weight: 500;
        cursor: pointer;
        padding: 8px 4px;
      }
      .step-primary {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 22px;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: var(--fs-sm);
        font-weight: 600;
        cursor: pointer;
      }
      .step-primary:hover { background: var(--accent-hover); }
      .step-primary:disabled { opacity: 0.4; cursor: default; }

      /* ---- Active filter summary ---- */
      .active-filters {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 20px;
        font-size: var(--fs-sm);
        color: var(--text-secondary);
        background: var(--surface-1);
        border-bottom: 1px solid var(--border-subtle);
      }
      .active-filters button {
        background: none;
        border: none;
        color: var(--accent);
        font-family: inherit;
        font-size: var(--fs-sm);
        font-weight: 600;
        cursor: pointer;
        padding: 4px;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.5;
        font-size: var(--fs-base);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .user {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .assistant {
        align-self: flex-start;
        background: var(--surface-1);
        border: 1px solid var(--border-subtle);
        border-bottom-left-radius: 4px;
      }

      .typing {
        align-self: flex-start;
        display: flex;
        gap: 4px;
        padding: 12px 16px;
        background: var(--surface-1);
        border: 1px solid var(--border-subtle);
        border-radius: 14px;
        border-bottom-left-radius: 4px;
      }
      .typing span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-muted);
      }
      @media (prefers-reduced-motion: no-preference) {
        .typing span {
          animation: typing-pulse 1.1s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.15s; }
        .typing span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typing-pulse {
          0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
          30% { opacity: 1; transform: translateY(-2px); }
        }
      }

      .listing-group { width: 100%; }
      .sort-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font-size: var(--fs-xs);
      }
      .sort-chip {
        padding: 5px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface-1);
        color: var(--text-secondary);
        font-family: inherit;
        font-size: var(--fs-xs);
        font-weight: 500;
        cursor: pointer;
      }
      .sort-chip.active {
        border-color: var(--accent);
        background: var(--accent-tint);
        color: var(--accent-hover);
      }
      .listing-cards { display: flex; flex-direction: column; }

      /* Listing card */
      .listing {
        align-self: flex-start;
        width: 100%;
        display: flex;
        gap: 12px;
        background: var(--surface-1);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: var(--fs-sm);
      }
      .listing + .listing { margin-top: -6px; }
      .listing-thumb-wrap { position: relative; flex-shrink: 0; }
      .listing-thumb {
        width: 84px;
        height: 84px;
        border-radius: 8px;
        flex-shrink: 0;
        object-fit: cover;
        background: var(--surface-3);
        display: block;
      }
      .listing-thumb-fallback {
        width: 84px;
        height: 84px;
        border-radius: 8px;
        flex-shrink: 0;
        background: var(--surface-3);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
      }
      .photo-count-badge {
        position: absolute;
        right: 4px;
        bottom: 4px;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(27, 27, 27, 0.72);
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        line-height: 1.4;
      }
      .listing-body { min-width: 0; flex: 1; }
      .listing .title { font-weight: 600; margin-bottom: 2px; }
      .listing .meta { color: var(--text-secondary); }
      .listing .freshness {
        margin-top: 2px;
        color: var(--text-muted);
        font-size: var(--fs-xs);
      }
      .listing .rating {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
        color: var(--text-secondary);
        font-size: var(--fs-xs);
      }
      .listing .rating .icon-star { color: var(--accent); }
      .listing .facilities {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        margin-top: 6px;
      }
      .facility-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--text-muted);
        font-size: var(--fs-xs);
      }
      /* Read-only landlord-stated tenant preference — display only, never a
         filter control (ADR-0004). */
      .listing .tenant-note {
        margin-top: 6px;
        padding: 5px 8px;
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--text-secondary);
        font-size: var(--fs-xs);
      }
      .listing-actions {
        display: flex;
        gap: 14px;
        margin-top: 8px;
      }
      .listing-actions a,
      .listing-actions button {
        display: inline-flex;
        align-items: center;
        background: none;
        border: none;
        padding: 0;
        color: var(--accent);
        font-family: inherit;
        text-decoration: none;
        font-weight: 600;
        font-size: var(--fs-sm);
        cursor: pointer;
      }
      .listing-actions a:hover,
      .listing-actions button:hover { color: var(--accent-hover); }

      .empty-state {
        align-self: flex-start;
        width: 100%;
        background: var(--surface-1);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 14px;
      }
      .empty-state p { margin: 0 0 10px; font-size: var(--fs-base); }
      .empty-state-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .empty-state-actions button {
        padding: 9px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface-0);
        color: var(--text-primary);
        font-family: inherit;
        font-size: var(--fs-sm);
        font-weight: 500;
        cursor: pointer;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      form {
        display: flex;
        gap: 10px;
        padding: 14px 20px;
        border-top: 1px solid var(--border-subtle);
        background: var(--surface-1);
      }
      form[hidden] { display: none; }
      input#input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-family: inherit;
        font-size: var(--fs-base);
        outline: none;
        background: var(--surface-0);
        color: var(--text-primary);
      }
      input#input:focus { border-color: var(--accent); }
      #send {
        padding: 10px 18px;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: var(--fs-sm);
        font-weight: 600;
        cursor: pointer;
      }
      #send:hover { background: var(--accent-hover); }
      #send:disabled { opacity: 0.5; cursor: default; }
      .err { color: var(--danger); font-size: var(--fs-sm); padding: 0 20px 8px; }
    </style>
  </head>
  <body>
    <!-- Inline icon sprite (Lucide-style outline set). Never emoji. -->
    <svg style="display: none">
      <symbol id="icon-star" viewBox="0 0 24 24">

      </symbol>
      <symbol id="icon-wallet" viewBox="0 0 24 24">

    <div class="app">
      <header>
        <h1>Cari Bilik Sewa KL</h1>
        <p id="subtitle">Bilik apa yang sedang anda cari di Lembah Klang?</p>
      </header>

      <div id="onboarding"></div>
      <div id="activeFilters" class="active-filters" hidden></div>
      <div id="messages" aria-live="polite" hidden></div>
      <p id="error" class="err" role="alert"></p>
      <form id="form" hidden>
        <label for="input" class="visually-hidden">Mesej kepada pembantu cari bilik</label>
        <input
          id="input"
          type="text"
          placeholder="Contoh: cari bilik single dekat LRT budjet RM800"
          autocomplete="off"
        />
        <button id="send" type="submit">Hantar</button>
      </form>
    </div>

    <script>
      const SESSION_KEY = "find-rooms-kl-session-id";
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const messagesEl = document.getElementById("messages");
      const errorEl = document.getElementById("error");
      const activeFiltersEl = document.getElementById("activeFilters");
      const onboardingEl = document.getElementById("onboarding");

      // Facility tag -> {icon, label}. Unknown tags still get a text-only badge.
      const FACILITY_META = {
        ac: { icon: "wind", label: "Air-cond" },
        wifi: { icon: "wifi", label: "Wi-Fi" },
        private_bathroom: { icon: "droplet", label: "Bilik air dalam" },
        shared_bathroom: { icon: null, label: "Bilik air kongsi" },
        parking: { icon: "car", label: "Parking" },
        laundry: { icon: "washing-machine", label: "Mesin basuh" },
        kitchen_access: { icon: null, label: "Akses dapur" },
        tv: { icon: null, label: "TV" },
        wardrobe: { icon: null, label: "Almari" },
        desk: { icon: null, label: "Meja" },
        water_heater: { icon: null, label: "Pemanas air" },
        near_transit: { icon: "train", label: "Dekat LRT/MRT" },
      };
      const FACILITY_STEP_TAGS = ["ac", "wifi", "private_bathroom", "parking", "laundry", "near_transit"];

      const GENDER_META = {
        female_only: { label: "Khas perempuan", icon: "users" },
        male_only: { label: "Khas lelaki", icon: "users" },
        mixed: { label: "Campur, tak kisah", icon: "users" },
      };

      const ROOM_TYPE_META = {
        single: { label: "Single", hint: "Satu orang" },
        master: { label: "Master", hint: "Bilik utama" },
        middle: { label: "Middle/Tengah", hint: "Saiz sederhana" },
        small: { label: "Small/Kecil", hint: "Saiz kecil" },
      };

      const BUDGET_RANGES = [
        { id: "b1", label: "< RM 500/bulan", max: 500 },
        { id: "b2", label: "RM 500 – 1,000", min: 500, max: 1000 },
        { id: "b3", label: "RM 1,000 – 1,500", min: 1000, max: 1500 },
        { id: "b4", label: "RM 1,500 – 2,000", min: 1500, max: 2000 },
        { id: "b5", label: "> RM 2,000", min: 2000 },
      ];

      const AREA_PICKS = ["Kuala Lumpur", "Petaling Jaya", "Subang Jaya", "Cheras"];

      function sessionId() {
        let id = localStorage.getItem(SESSION_KEY);
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem(SESSION_KEY, id);
        }
        return id;
      }

      function ringgit(amount) {
        return new Intl.NumberFormat("ms-MY", { style: "currency", currency: "MYR", maximumFractionDigits: 0 }).format(
          amount,
        );
      }

      function formatPrice(amount, period) {
        if (typeof amount !== "number") return "Harga tak dinyatakan";
        const labels = { monthly: "/bulan", yearly: "/tahun", weekly: "/minggu", daily: "/hari" };
        return `${ringgit(amount)}${period && labels[period] ? labels[period] : ""}`;
      }

      // ============================================================
      // Onboarding wizard — asks the key criteria up front, then composes one
      // structured message into the normal chat flow.
      // ============================================================

      const wizard = {
        step: 0,
        budget: null,
        area: "",
        gender: null,
        roomType: null,
        facilities: [],
      };

      const STEPS = ["budget", "area", "gender", "room_type", "facilities"];

      function renderProgressDots() {
        const dots = STEPS.map((_, i) => {
          const cls = i < wizard.step ? "done" : i === wizard.step ? "current" : "";
          return `<button type="button" class="progress-dot ${cls}" data-step="${i}" aria-label="Langkah ${i + 1}"></button>`;
        }).join("");
        return `<div class="progress-dots">${dots}</div>`;
      }

      function renderSkipWizardLink() {
        return `<div class="skip-wizard">
          <button type="button" id="skipWizard">Langkau, saya nak taip sendiri</button>
        </div>`;
      }

      function optionCardHtml({ selected, icon, label, hint, dataset }) {
        const attrs = Object.entries(dataset)
          .map(([k, v]) => `data-${k}="${v}"`)
          .join(" ");
        const iconHtml = icon ? `<svg class="icon icon-lg"><use href="#icon-${icon}" /></svg>` : "";
        const hintHtml = hint ? `<span class="option-hint">${hint}</span>` : "";
        return `<button type="button" class="option-card${selected ? " selected" : ""}" ${attrs}>
          ${iconHtml}
          <span class="option-label">${label}${hintHtml}</span>
        </button>`;
      }

      function renderWizard() {
        const step = STEPS[wizard.step];
        onboardingEl.innerHTML = renderProgressDots() + renderStepBody(step) + renderSkipWizardLink();
        wireStepEvents(step);
        wireProgressDots();
        wireSkipWizardLink();
      }

      function renderStepBody(step) {
        if (step === "budget") {
          const cards = BUDGET_RANGES.map((r) =>
            optionCardHtml({
              selected: wizard.budget?.id === r.id,
              icon: "wallet",
              label: r.label,
              dataset: { budget: r.id },
            }),
          ).join("");
          return `
            <p class="step-eyebrow">Langkah 1 dari 5</p>
            <h2 class="step-title">Berapa budget bulanan anda?</h2>
            <p class="step-subtitle">Pilih julat yang paling sesuai, boleh ubah kemudian.</p>
            <div class="option-grid single-col">${cards}</div>
            <div class="step-actions">
              <span></span>
              <button type="button" class="step-primary" id="stepNext">
                Seterusnya <svg class="icon"><use href="#icon-arrow-right" /></svg>
              </button>
            </div>`;
        }

        if (step === "area") {
          const cards = AREA_PICKS.map((a) =>
            optionCardHtml({
              selected: wizard.area === a,
              icon: "map-pin",
              label: a,
              dataset: { area: a },
            }),
          ).join("");
          return `
            <p class="step-eyebrow">Langkah 2 dari 5</p>
            <h2 class="step-title">Cari bilik di kawasan mana?</h2>
            <p class="step-subtitle">Pilih kawasan popular atau taip sendiri.</p>
            <div class="option-grid">${cards}</div>
            <input type="text" id="areaInput" class="step-input" placeholder="Taip kawasan atau bandar..." value="${wizard.area ?? ""}" />
            <div class="step-actions">
              <button type="button" class="text-link" id="stepBack">
                <svg class="icon"><use href="#icon-chevron-left" /></svg> Kembali
              </button>
              <button type="button" class="step-primary" id="stepNext">
                Seterusnya <svg class="icon"><use href="#icon-arrow-right" /></svg>
              </button>
            </div>`;
        }

        if (step === "gender") {
          const cards = Object.entries(GENDER_META)
            .map(([key, meta]) =>
              optionCardHtml({
                selected: wizard.gender === key,
                icon: meta.icon,
                label: meta.label,
                dataset: { gender: key },
              }),
            )
            .join("");
          return `
            <p class="step-eyebrow">Langkah 3 dari 5</p>
            <h2 class="step-title">Khas lelaki, perempuan, atau campur?</h2>
            <p class="step-subtitle">Supaya bilik yang muncul ikut peraturan penghuninya.</p>
            <div class="option-grid single-col">${cards}</div>
            <div class="step-actions">
              <button type="button" class="text-link" id="stepBack">
                <svg class="icon"><use href="#icon-chevron-left" /></svg> Kembali
              </button>
              <button type="button" class="step-primary" id="stepNext">
                Seterusnya <svg class="icon"><use href="#icon-arrow-right" /></svg>
              </button>
            </div>`;
        }

        if (step === "room_type") {
          const cards = Object.entries(ROOM_TYPE_META)
            .map(([key, meta]) =>
              optionCardHtml({
                selected: wizard.roomType === key,
                icon: "bed",
                label: meta.label,
                hint: meta.hint,
                dataset: { room_type: key },
              }),
            )
            .join("");
          return `
            <p class="step-eyebrow">Langkah 4 dari 5</p>
            <h2 class="step-title">Jenis bilik yang dicari?</h2>
            <p class="step-subtitle">Single, master, tengah, atau kecil — atau langkau jika tak kisah.</p>
            <div class="option-grid single-col">${cards}</div>
            <div class="step-actions">
              <button type="button" class="text-link" id="stepBack">
                <svg class="icon"><use href="#icon-chevron-left" /></svg> Kembali
              </button>
              <button type="button" class="step-primary" id="stepNext">
                Seterusnya <svg class="icon"><use href="#icon-arrow-right" /></svg>
              </button>
            </div>`;
        }

        // facilities — optional, last step
        const cards = FACILITY_STEP_TAGS.map((tag) => {
          const meta = FACILITY_META[tag];
          return optionCardHtml({
            selected: wizard.facilities.includes(tag),
            icon: meta.icon,
            label: meta.label,
            dataset: { facility: tag },
          });
        }).join("");
        return `
          <p class="step-eyebrow">Langkah 5 dari 5</p>
          <h2 class="step-title">Fasiliti yang anda perlukan?</h2>
          <p class="step-subtitle">Opsional — pilih mana-mana, atau langkau sahaja.</p>
          <div class="option-grid">${cards}</div>
          <div class="step-actions">
            <button type="button" class="text-link" id="stepBack">
              <svg class="icon"><use href="#icon-chevron-left" /></svg> Kembali
            </button>
            <button type="button" class="step-primary" id="stepNext">
              Cari bilik <svg class="icon"><use href="#icon-arrow-right" /></svg>
            </button>
          </div>`;
      }

      function wireStepEvents(step) {
        onboardingEl.querySelectorAll(".option-card").forEach((card) => {
          card.addEventListener("click", () => {
            if (step === "budget") {
              wizard.budget = BUDGET_RANGES.find((r) => r.id === card.dataset.budget);
            } else if (step === "area") {
              wizard.area = card.dataset.area;
              const areaInput = document.getElementById("areaInput");
              if (areaInput) areaInput.value = wizard.area;
            } else if (step === "gender") {
              wizard.gender = card.dataset.gender;
            } else if (step === "room_type") {
              wizard.roomType = card.dataset.room_type;
            } else if (step === "facilities") {
              const tag = card.dataset.facility;
              wizard.facilities = wizard.facilities.includes(tag)
                ? wizard.facilities.filter((t) => t !== tag)
                : [...wizard.facilities, tag];
            }
            renderWizard();
          });
        });

        const areaInput = document.getElementById("areaInput");
        if (areaInput) {
          areaInput.addEventListener("input", () => {
            wizard.area = areaInput.value.trim();
          });
        }

        document.getElementById("stepBack")?.addEventListener("click", () => {
          wizard.step = Math.max(0, wizard.step - 1);
          renderWizard();
        });

        document.getElementById("stepNext")?.addEventListener("click", () => {
          if (step === "facilities") {
            finishWizard();
          } else {
            wizard.step = Math.min(STEPS.length - 1, wizard.step + 1);
            renderWizard();
          }
        });
      }

      function wireProgressDots() {
        onboardingEl.querySelectorAll(".progress-dot").forEach((dot) => {
          dot.addEventListener("click", () => {
            wizard.step = Number(dot.dataset.step);
            renderWizard();
          });
        });
      }

      function wireSkipWizardLink() {
        document.getElementById("skipWizard")?.addEventListener("click", skipEntireWizard);
      }

      function skipEntireWizard() {
        onboardingEl.hidden = true;
        messagesEl.hidden = false;
        form.hidden = false;
        addBubble("Baiklah, teruskan — taip apa yang anda cari.", "assistant");
        input.focus();
      }

      function composeWizardMessage() {
        const parts = [];
        if (wizard.area) parts.push(`cari bilik di ${wizard.area}`);
        else parts.push("cari bilik sewa");
        if (wizard.gender) parts.push(GENDER_META[wizard.gender].label.toLowerCase());
        if (wizard.roomType) parts.push(`jenis bilik ${ROOM_TYPE_META[wizard.roomType].label.toLowerCase()}`);
        if (wizard.budget) {
          if (wizard.budget.max && wizard.budget.min) {
            parts.push(`budget antara ${ringgit(wizard.budget.min)} dan ${ringgit(wizard.budget.max)}`);
          } else if (wizard.budget.max) parts.push(`budget maksimum ${ringgit(wizard.budget.max)}`);
          else if (wizard.budget.min) parts.push(`budget minimum ${ringgit(wizard.budget.min)}`);
        }
        if (wizard.facilities.length > 0) {
          const labels = wizard.facilities.map((t) => FACILITY_META[t].label);
          parts.push(`dengan fasiliti ${labels.join(", ")}`);
        }
        return parts.join(", ");
      }

      function finishWizard() {
        onboardingEl.hidden = true;
        messagesEl.hidden = false;
        form.hidden = false;
        void send(composeWizardMessage());
      }

      function reopenWizard(filters) {
        if (filters) {
          if (typeof filters.priceMin === "number" || typeof filters.priceMax === "number") {
            wizard.budget =
              BUDGET_RANGES.find((r) => r.min === filters.priceMin && r.max === filters.priceMax) ?? {
                id: "custom",
                label: "Custom",
                min: filters.priceMin,
                max: filters.priceMax,
              };
          }
          if (filters.area) wizard.area = filters.area;
          if (filters.gender) wizard.gender = filters.gender;
          if (filters.roomType) wizard.roomType = filters.roomType;
          if (Array.isArray(filters.facilities)) wizard.facilities = filters.facilities;
        }
        wizard.step = 0;
        messagesEl.hidden = true;
        form.hidden = true;
        activeFiltersEl.hidden = true;
        onboardingEl.hidden = false;
        renderWizard();
      }

      renderWizard();

      // ============================================================
      // Chat mode
      // ============================================================

      function addBubble(text, role) {
        const el = document.createElement("div");
        el.className = `msg ${role}`;
        el.textContent = text;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      function showTyping() {
        const el = document.createElement("div");
        el.className = "typing";
        el.id = "typingIndicator";
        el.innerHTML = "<span></span><span></span><span></span>";
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function hideTyping() {
        document.getElementById("typingIndicator")?.remove();
      }

      function safeHttpUrl(value) {
        try {
          const parsed = new URL(value, location.href);
          return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : null;
        } catch {
          return null;
        }
      }

      function buildFacilityBadge(tag) {
        const meta = FACILITY_META[tag];
        const label = meta ? meta.label : tag;
        const span = document.createElement("span");
        span.className = "facility-badge";
        if (meta?.icon) {
          span.innerHTML = `<svg class="icon icon-sm"><use href="#icon-${meta.icon}" /></svg>`;
        }
        span.append(label);
        return span;
      }

      function relativeFreshness(isoString) {
        if (!isoString) return null;
        const then = new Date(isoString).getTime();
        if (Number.isNaN(then)) return null;
        const days = Math.floor((Date.now() - then) / (1000 * 60 * 60 * 24));
        if (days <= 0) return "Dikemaskini hari ini";
        if (days === 1) return "Dikemaskini semalam";
        if (days < 30) return `Dikemaskini ${days} hari lalu`;
        return `Dikemaskini ${Math.floor(days / 30)} bulan lalu`;
      }

      function roomTypeLabel(roomType) {
        const meta = ROOM_TYPE_META[roomType];
        return meta ? meta.label : null;
      }

      function buildListingCard(l) {
        const card = document.createElement("div");
        card.className = "listing";

        const imageUrls = Array.isArray(l.image_urls) ? l.image_urls : l.image_url ? [l.image_url] : [];
        const safeImg = imageUrls[0] ? safeHttpUrl(imageUrls[0]) : null;
        if (safeImg) {
          const thumbWrap = document.createElement("div");
          thumbWrap.className = "listing-thumb-wrap";
          const img = document.createElement("img");
          img.className = "listing-thumb";
          img.src = safeImg;
          img.alt = "";
          thumbWrap.appendChild(img);
          if (imageUrls.length > 1) {
            const badge = document.createElement("span");
            badge.className = "photo-count-badge";
            badge.textContent = `+${imageUrls.length - 1}`;
            thumbWrap.appendChild(badge);
          }
          card.appendChild(thumbWrap);
        } else {
          const fallback = document.createElement("div");
          fallback.className = "listing-thumb-fallback";
          fallback.innerHTML = `<svg class="icon icon-lg"><use href="#icon-home" /></svg>`;
          card.appendChild(fallback);
        }

        const body = document.createElement("div");
        body.className = "listing-body";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = l.title;
        body.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "meta";
        const metaParts = [formatPrice(l.price_amount, l.price_period)];
        const roomLabel = roomTypeLabel(l.room_type);
        if (roomLabel) metaParts.push(roomLabel);
        if (l.area_raw) metaParts.push(l.area_raw);
        meta.textContent = metaParts.join(" · ");
        body.appendChild(meta);

        // Deposit, if the landlord stated one — read-only passthrough.
        if (l.deposit_amount_raw || l.deposit_terms_raw) {
          const dep = document.createElement("div");
          dep.className = "freshness";
          dep.textContent = `Deposit: ${[l.deposit_amount_raw, l.deposit_terms_raw].filter(Boolean).join(" · ")}`;
          body.appendChild(dep);
        }

        const freshnessText = relativeFreshness(l.last_refreshed_at);
        if (freshnessText) {
          const freshness = document.createElement("div");
          freshness.className = "freshness";
          freshness.textContent = freshnessText;
          body.appendChild(freshness);
        }

        if (Array.isArray(l.facilities) && l.facilities.length > 0) {
          const facilities = document.createElement("div");
          facilities.className = "facilities";
          const shown = l.facilities.slice(0, 3);
          for (const tag of shown) {
            facilities.appendChild(buildFacilityBadge(tag));
          }
          const remaining = l.facilities.length - shown.length;
          if (remaining > 0) {
            const more = document.createElement("span");
            more.className = "facility-badge";
            more.textContent = `+${remaining} lagi`;
            facilities.appendChild(more);
          }
          body.appendChild(facilities);
        }

        // Landlord-stated tenant preference — a read-only note, deliberately
        // NOT a filter control (ADR-0004).
        if (l.tenant_preference_raw) {
          const note = document.createElement("div");
          note.className = "tenant-note";
          note.textContent = `Keutamaan tuan rumah: ${l.tenant_preference_raw}`;
          body.appendChild(note);
        }

        const actions = document.createElement("div");
        actions.className = "listing-actions";

        const safeUrl = safeHttpUrl(l.url);
        if (safeUrl) {
          const link = document.createElement("a");
          link.href = safeUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Lihat listing";
          actions.appendChild(link);
        }

        const askBtn = document.createElement("button");
        askBtn.type = "button";
        askBtn.innerHTML = `<svg class="icon icon-sm"><use href="#icon-message-circle" /></svg>&nbsp;Tanya detail`;
        askBtn.addEventListener("click", () => {
          void send(`ceritakan dengan lebih lanjut tentang "${l.title}"`);
        });
        actions.appendChild(askBtn);

        body.appendChild(actions);
        card.appendChild(body);
        return card;
      }

      const LISTING_SORTS = [
        { id: "recent", label: "Terkini" },
        { id: "price_asc", label: "Harga terendah" },
        { id: "price_desc", label: "Harga tertinggi" },
      ];

      function sortListings(listings, sortId) {
        const arr = [...listings];
        if (sortId === "price_asc") {
          arr.sort((a, b) => (a.price_amount ?? Infinity) - (b.price_amount ?? Infinity));
        } else if (sortId === "price_desc") {
          arr.sort((a, b) => (b.price_amount ?? -1) - (a.price_amount ?? -1));
        }
        return arr; // "recent" = keep the server's own order
      }

      function addListings(listings) {
        if (!listings || listings.length === 0) return;

        const group = document.createElement("div");
        group.className = "listing-group";

        const cardsWrap = document.createElement("div");
        cardsWrap.className = "listing-cards";

        let activeSort = "recent";
        function renderCards() {
          cardsWrap.innerHTML = "";
          for (const l of sortListings(listings, activeSort)) {
            cardsWrap.appendChild(buildListingCard(l));
          }
        }

        if (listings.length > 1) {
          const sortBar = document.createElement("div");
          sortBar.className = "sort-bar";
          for (const s of LISTING_SORTS) {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = `sort-chip${s.id === activeSort ? " active" : ""}`;
            chip.textContent = s.label;
            chip.addEventListener("click", () => {
              activeSort = s.id;
              sortBar.querySelectorAll(".sort-chip").forEach((b) => b.classList.remove("active"));
              chip.classList.add("active");
              renderCards();
            });
            sortBar.appendChild(chip);
          }
          group.appendChild(sortBar);
        }

        group.appendChild(cardsWrap);
        messagesEl.appendChild(group);
        renderCards();
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addEmptyState(filters) {
        const card = document.createElement("div");
        card.className = "empty-state";
        const p = document.createElement("p");
        p.textContent = "Belum ada bilik yang betul-betul sepadan. Cuba naikkan budget atau cari kawasan lain.";
        card.appendChild(p);

        const actions = document.createElement("div");
        actions.className = "empty-state-actions";

        if (typeof filters?.priceMax === "number") {
          const nextBudget = filters.priceMax + 200;
          const raiseBudget = document.createElement("button");
          raiseBudget.type = "button";
          raiseBudget.textContent = `Naikkan budget ke ${ringgit(nextBudget)}`;
          raiseBudget.addEventListener("click", () => void send(`naikkan budget jadi ${ringgit(nextBudget)}`));
          actions.appendChild(raiseBudget);
        }

        const otherArea = document.createElement("button");
        otherArea.type = "button";
        otherArea.textContent = "Cari kawasan lain";
        otherArea.addEventListener("click", () => void send("cuba cari di kawasan lain"));
        actions.appendChild(otherArea);

        card.appendChild(actions);
        messagesEl.appendChild(card);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function renderActiveFilters(filters) {
        if (!filters || typeof filters !== "object") {
          activeFiltersEl.hidden = true;
          return;
        }
        const parts = [];
        if (filters.area) parts.push(filters.area);
        if (typeof filters.priceMax === "number") parts.push(`≤ ${ringgit(filters.priceMax)}`);
        else if (typeof filters.priceMin === "number") parts.push(`≥ ${ringgit(filters.priceMin)}`);
        if (filters.gender && GENDER_META[filters.gender]) parts.push(GENDER_META[filters.gender].label);
        if (filters.roomType && ROOM_TYPE_META[filters.roomType]) parts.push(ROOM_TYPE_META[filters.roomType].label);

        if (parts.length === 0) {
          activeFiltersEl.hidden = true;
          return;
        }

        activeFiltersEl.hidden = false;
        activeFiltersEl.innerHTML = "";
        const label = document.createElement("span");
        label.textContent = parts.join(" · ");
        const change = document.createElement("button");
        change.type = "button";
        change.textContent = "Ubah";
        change.addEventListener("click", () => reopenWizard(filters));
        activeFiltersEl.append(label, change);
      }

      async function send(message) {
        errorEl.textContent = "";
        sendBtn.disabled = true;
        addBubble(message, "user");
        showTyping();
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId(), message }),
          });
          const data = await res.json();
          hideTyping();
          if (!res.ok) {
            console.error("[chat-kl] request failed", res.status, data);
            errorEl.textContent = "Ada masalah dalam sistem kami. Cuba lagi sebentar — kalau masih gagal, muat semula halaman.";
            return;
          }
          input.value = "";
          addBubble(data.reply || "", "assistant");
          if (Array.isArray(data.listings)) {
            if (data.listings.length > 0) addListings(data.listings);
            else addEmptyState(data.filters);
          }
          renderActiveFilters(data.filters);
        } catch (err) {
          hideTyping();
          console.error("[chat-kl] network error", err);
          errorEl.textContent = "Sambungan terputus. Semak internet, kemudian cuba hantar lagi.";
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        void send(message);
      });
    </script>
  </body>
</html>
