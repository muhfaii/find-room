<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cari Kost Jakarta — Chat</title>
    <style>
      :root {
        --bg: #f5f4f0;
        --panel: #ffffff;
        --text: #1c1c1a;
        --muted: #6b6a66;
        --accent: #0f766e;
        --accent-dark: #115e59;
        --border: #e2e0da;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app {
        max-width: 720px;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header h1 {
        margin: 0;
        font-size: 18px;
      }
      header p {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.45;
        font-size: 14px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .user {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .assistant {
        align-self: flex-start;
        background: var(--panel);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .listing {
        align-self: flex-start;
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 13px;
      }
      .listing + .listing { margin-top: -6px; }
      .listing .title { font-weight: 600; margin-bottom: 2px; }
      .listing .meta { color: var(--muted); }
      .listing a {
        color: var(--accent-dark);
        text-decoration: none;
        font-weight: 600;
      }
      .listing a:hover { text-decoration: underline; }
      form {
        display: flex;
        gap: 10px;
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        background: var(--panel);
      }
      input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 14px;
        outline: none;
      }
      input:focus { border-color: var(--accent); }
      button {
        padding: 10px 18px;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: var(--accent-dark); }
      button:disabled { opacity: 0.6; cursor: default; }
      .err { color: #b91c1c; font-size: 13px; padding: 0 20px 8px; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Cari Kost Jakarta</h1>
        <p>Kost apa yang sedang kamu cari?</p>
      </header>
      <div id="messages"></div>
      <p id="error" class="err"></p>
      <form id="form">
        <input
          id="input"
          type="text"
          placeholder="Contoh: cari kost cewek deket UI budget 1.5 juta"
          autocomplete="off"
        />
        <button id="send" type="submit">Kirim</button>
      </form>
    </div>

    <script>
      const SESSION_KEY = "find-rooms-session-id";
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const messagesEl = document.getElementById("messages");
      const errorEl = document.getElementById("error");

      function sessionId() {
        let id = localStorage.getItem(SESSION_KEY);
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem(SESSION_KEY, id);
        }
        return id;
      }

      function formatPrice(amount, period) {
        if (typeof amount !== "number") return "Harga tidak disebutkan";
        const rp = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 });
        const labels = { monthly: "/bulan", daily: "/hari", weekly: "/minggu", yearly: "/tahun" };
        return `${rp.format(amount)}${period && labels[period] ? labels[period] : ""}`;
      }

      function addBubble(text, role) {
        const el = document.createElement("div");
        el.className = `msg ${role}`;
        el.textContent = text;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      // Only ever render http(s) links. `url` ultimately comes from scraped data
      // — a malformed/malicious scheme (e.g. "javascript:...") must never end up
      // as a clickable href.
      function safeHttpUrl(value) {
        try {
          const parsed = new URL(value, location.href);
          return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : null;
        } catch {
          return null;
        }
      }

      function addListings(listings) {
        for (const l of listings || []) {
          const el = document.createElement("div");
          el.className = "listing";
          el.innerHTML =
            `<div class="title"></div>` +
            `<div class="meta"></div>`;
          el.querySelector(".title").textContent = l.title;
          const parts = [formatPrice(l.price_amount, l.price_period), l.area_raw].filter(Boolean).join(" · ");
          el.querySelector(".meta").textContent = parts;
          const safeUrl = safeHttpUrl(l.url);
          if (safeUrl) {
            const link = document.createElement("a");
            link.href = safeUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Lihat listing";
            el.appendChild(link);
          }
          messagesEl.appendChild(el);
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function send(message) {
        errorEl.textContent = "";
        sendBtn.disabled = true;
        addBubble(message, "user");
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId(), message }),
          });
          const data = await res.json();
          if (!res.ok) {
            errorEl.textContent = data.error || `Gagal (${res.status})`;
            return;
          }
          addBubble(data.reply || "", "assistant");
          if (data.listings && data.listings.length > 0) addListings(data.listings);
        } catch (err) {
          errorEl.textContent = `Kesalahan jaringan: ${err}`;
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        input.value = "";
        void send(message);
      });
    </script>
  </body>
</html>
